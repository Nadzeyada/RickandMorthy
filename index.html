<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RickandMorthyStore</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;700&display=swap">
</head>
<body>
  <header>
      <button type="button" class="burger-button">
          <svg viewBox="0 0 488 488" id="burger-icon">
            <use xlink:href="/assets/img/sprite.svg#burger-menu"></use>
          </svg>
      </button>
      <div class="header__text-content">
        <h1>Let make something great</h1>
        <p class="header__description">Lorem ipsum dolor sit amet consectetur adipisicing elit. Velit, incidunt?</p>
      </div>
      </header>
  <main>
    <section class="portfolio-section">
      <aside class="sidebar hidden">
        <img src="./assets/img/person.jpg" alt="person" class="sidebar__image">
        <ul class="portfolio-section__list">
          <li class="portfolio-section__list-item active"><a href="#" class="navbar-link link">Clients</a></li>
          <li class="portfolio-section__list-item "><a href="#" class="navbar-link link">Products</a></li>
          <li class="portfolio-section__list-item "><a href="#" class="navbar-link link">Feedback</a></li>
        </ul>
      </aside>
      <h2 class="portfolio-section__title">Portfolio</h2>
      <ul class="portfolio-section__list">
        <li class="portfolio-section__list-item active"><a href="#" class="navbar-link link">Clients</a></li>
        <li class="portfolio-section__list-item "><a href="#" class="navbar-link link">Products</a></li>
        <li class="portfolio-section__list-item "><a href="#" class="navbar-link link">Feedback</a></li>
      </ul>
      </aside>
      <div class="loader"></div>
      <div class="portfolio-section__cards-container">
      </div>
      <div class="portfolio-section__popup hidden">
        <div class="portfolio-section__popup-window">
          <button type="button" class="popup__close-button">&#10006;</button>
          <p class="popup__message"></p>
        </div>
      </div>
    </section>
    <form class="form" novalidate>
      <h2 class="form__title">I want to get fresh updates</h2>
      <label for="username">first name:</label>
      <input type="text" name="username" id="username" required>
      <small class="form__error"></small>

      <label for="email">email:</label>
      <input type="email" name="email" id="email" required>
      <small class="form__error"></small>

      
      <label for="consent">
        <input type="checkbox" name="consent" id="consent" required>
        I consent to the processing of personal data
      </label>
      <small class="form__error"></small>

      <button type="submit" class="subscribe-button">Subscribe</button>
    </form>
    <div class="form__popup hidden">
      <div class="form__popup-window">
        <button type="button" class="popup__close-button">&#10006;</button>
        <p class="popup__message"></p>
      </div>
    </div>
  </main>
  <footer>
    <h3 class="footer__title">All rights reserved 2023</h3>
  </footer>
  <script type="module" src="script.js"></script>
</body>
</html>
